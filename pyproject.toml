[build-system]
requires = ["setuptools>=77.0.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "awsume"
description = "Awsume - A cli that makes using AWS IAM credentials easy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Trek10, Inc", email = "package-management@trek10.com" }]
# The codebase uses PEP 604 unions (`str | None`) and `datetime.UTC`,
# which require Python 3.11+.
requires-python = ">=3.11"
dependencies = [
    "colorama",
    "boto3",
    "psutil",
    "pluggy",
    "pyyaml",
]
# Version is derived from git tags by setuptools-scm (see [tool.setuptools_scm]).
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/trek10inc/awsume"

[project.optional-dependencies]
saml = ["xmltodict"]
fuzzy = ["python-levenshtein"]
console = ["awsume-console-plugin"]

[project.scripts]
awsumepy = "awsume.awsumepy.main:main"
autoawsume = "awsume.autoawsume.main:main"
awsume-configure = "awsume.configure.main:main"
awsume-autocomplete = "awsume_autocomplete:main"

# Development tooling (PEP 735 dependency group), installed by `uv sync`.
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "ruff",
]

[tool.setuptools]
# The shell wrappers (bash/zsh/fish/powershell/cmd) are installed as scripts.
# There is no static PEP 621 equivalent, so they stay under tool.setuptools.
script-files = [
    "shell_scripts/awsume",
    "shell_scripts/awsume.ps1",
    "shell_scripts/awsume.bat",
    "shell_scripts/awsume.fish",
]

[tool.setuptools_scm]
# Version is derived from git tags. Tagging convention: v-prefixed PEP 440
# versions, e.g. `v4.5.5` (release) and `v4.5.5rc1` (release candidate).
#
# The resolved version is written to awsume/_version.py so it is importable at
# runtime from a built/installed tree (see awsume/__data__.py). This file is
# generated and git-ignored.
version_file = "awsume/_version.py"
#
# version_scheme = "guess-next-dev" (the default): a clean tag `v4.5.5` yields
# `4.5.5`; commits after the tag bump to the next patch as a dev pre-release,
# e.g. `4.5.6.dev3` (3 commits past v4.5.5). This gives untagged "test" builds
# a unique, monotonically increasing version.
version_scheme = "guess-next-dev"
#
# local_scheme = "node-and-date": appends a local segment with the short git
# hash (and a dirty-date when the tree has uncommitted changes), e.g.
# `4.5.6.dev3+g<hash>`. This makes branch/commit builds distinguishable.
local_scheme = "node-and-date"
#
# Fallback used when building from an unversioned tree (no git, no tags):
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
# Include the two top-level packages and their subpackages, excluding tests.
include = ["awsume*", "awsume_autocomplete*"]
exclude = ["test*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Explicit rule selection so results are deterministic across environments
# rather than depending on ruff's ambient defaults.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    # Line length is owned by the formatter; it already wraps what it can.
    # Remaining long lines are strings/URLs/identifiers that cannot be split.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# fastentrypoints.py is vendored; keep it as upstream ships it.
"fastentrypoints.py" = ["PLC0415"]
# Tests intentionally assign call results for readability and build
# large fixtures; don't fight those patterns.
"test/**" = ["PLW"]

[tool.ruff.lint.isort]
known-first-party = ["awsume", "awsume_autocomplete"]
