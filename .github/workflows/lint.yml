name: Lint

on:
  push:
    branches:
      - 'releases/**'
      - master
  pull_request:
    branches:
      - 'releases/**'
      - master

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ruff lint
        run: uv run --only-group dev ruff check .

      - name: Ruff format check
        run: uv run --only-group dev ruff format --check .
