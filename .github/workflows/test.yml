name: Run tests

on:
  push:
    branches:
      - 'releases/**'
      - master
  pull_request:
    branches:
      - 'releases/**'
      - master

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # awsume requires Python 3.11+ (PEP 604 unions and datetime.UTC).
        python-version: [ '3.11', '3.12', '3.13' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest test --cov=awsume --cov-report term
